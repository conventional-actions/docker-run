name: 'Docker Run'
description: 'Run a command in a new container'
inputs:
  image:
    description: 'Container image to run'
    required: true
  options:
    description: 'Options to pass to Docker'
    required: false
  command:
    description: 'Container command'
    required: false
  entrypoint:
    description: 'Container entrypoint'
    required: false
  run:
    description: 'Run command in container'
    required: false
  shell:
    description: 'Use a specific shell'
    required: false
  network:
    description: 'Docker Network ID'
    default: ${{ job.container.network }}
    required: false
outputs:
  docker-version:
    description: 'Set by run scripts that append to GITHUB_OUTPUT (e.g. docker-version=value)'
  file-contents:
    description: 'Set by run scripts that append file-contents to GITHUB_OUTPUT'
runs:
  using: 'node24'
  main: 'dist/index.cjs'
branding:
  color: purple
  icon: clock
